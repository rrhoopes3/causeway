<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>__TITLE__</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0d0f12;
  --ink: #e4e7ec;
  --muted: #8d95a2;
  --faint: #5a616c;
  --glass: rgba(255, 255, 255, 0.035);
  --glass-strong: rgba(255, 255, 255, 0.06);
  --edge: rgba(255, 255, 255, 0.09);
  --gold: #d4a24c;
  --c: #9aa3af;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[data-tag="IN"] { --c: #d4a24c; }
[data-tag="CARRY"] { --c: #e9953a; }
[data-tag="GOAL"] { --c: #8fb3d9; }
[data-tag="SELF"] { --c: #a78bfa; }
[data-tag="UNSOURCED"] { --c: #ef5b5b; }
[data-tag="PROSE"] { --c: #9aa3af; }
[data-tag="LIT"] { --c: #4d5560; }
[data-tag="FINAL"] { --c: #cdd5e0; }
[data-tag="NOARGS"] { --c: #4d5560; }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  min-height: 100vh;
  font: 14px/1.5 var(--sans);
  background:
    radial-gradient(900px 480px at 88% -10%, rgba(212, 162, 76, 0.08), transparent 70%),
    var(--bg);
}
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 24px 96px; }
.masthead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px 28px; margin-bottom: 18px; }
.kicker { color: var(--gold); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; }
h1 { margin: 4px 0 6px; font-size: 24px; font-weight: 600; letter-spacing: 0.01em; overflow-wrap: anywhere; }
.meta { color: var(--muted); font: 12px/1.6 var(--mono); }
.counts { display: flex; flex-wrap: wrap; gap: 6px; }
.panel {
  background: var(--glass);
  border: 1px solid var(--edge);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 14px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
}
.panel-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.panel h2 { margin: 0; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.panel h3 { margin: 14px 0 0; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.panel p { margin: 6px 0; }
.muted { color: var(--muted); }
.count {
  font: 12px var(--mono);
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid var(--edge);
  color: var(--ink);
  background: rgba(255, 255, 255, 0.03);
}
.count[data-tag] { border-color: var(--c); color: var(--c); }
.count.warn { border-color: rgba(255, 139, 139, 0.55); color: #ff9a9a; }

.legend-row { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.legend-item { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.legend-note { margin-top: 10px; color: var(--faint); font-size: 12px; }

/* chips: one traced leaf or atom */
.chip {
  display: inline-flex;
  align-items: baseline;
  max-width: 100%;
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid var(--c);
  background: rgba(255, 255, 255, 0.03);
  font: 11.5px/1.45 var(--mono);
  color: var(--ink);
  opacity: var(--fade, 1);
  cursor: pointer;
  touch-action: manipulation;
  outline: none;
  transition: opacity 0.18s, box-shadow 0.18s, background 0.18s;
}
.chip.static { cursor: default; }
.chip .warn { color: #ff8b8b; margin-right: 3px; }
.chip .path { color: var(--c); flex: 0 1 auto; }
.chip .eq { color: var(--faint); white-space: pre; }
.chip .val { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #eceff3; }
.chip .tg { margin-left: 8px; font-size: 9.5px; letter-spacing: 0.08em; color: var(--c); opacity: 0.85; text-transform: uppercase; flex: 0 0 auto; }
.chip:hover { background: rgba(255, 255, 255, 0.07); }
.chip:focus-visible { box-shadow: 0 0 0 2px rgba(212, 162, 76, 0.6); }
.chip.taint { box-shadow: 0 0 0 1px rgba(255, 139, 139, 0.45); }
.chip.hot { background: rgba(255, 255, 255, 0.08); box-shadow: 0 0 0 1px var(--c), 0 0 16px -2px var(--c); }
.chip[data-tag="UNSOURCED"] { animation: pulse 1.8s ease-in-out infinite; }
.stage.focused .chip:not(.hot) { opacity: 0.22; }

/* badges and count pills */
.badge {
  font: 11px var(--mono);
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid var(--edge);
  color: var(--muted);
  background: none;
  white-space: nowrap;
}
.badge.tag { border-color: var(--c); color: var(--c); }
.badge.tag[data-tag="UNSOURCED"] { animation: pulse 1.8s ease-in-out infinite; }
.badge.warn { border-color: rgba(255, 139, 139, 0.6); color: #ff9a9a; }
.badge.quiet { opacity: 0.7; }
.badge.goal-badge { border-color: #8fb3d9; color: #8fb3d9; }
.badge.echo { border-style: dashed; border-color: rgba(167, 139, 250, 0.7); color: #c9b8ff; cursor: pointer; }
.badge.near { border-color: rgba(212, 162, 76, 0.6); color: var(--gold); }
.badge.upset { border-color: rgba(255, 139, 139, 0.6); color: #ff9a9a; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239, 91, 91, 0.55); }
  50% { box-shadow: 0 0 0 3px rgba(239, 91, 91, 0); }
}

/* the two-column timeline */
.stage { position: relative; padding-right: 84px; }
.rows { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 24px; }
.curves { position: absolute; left: 0; top: 0; z-index: 2; overflow: visible; pointer-events: none; }
.curves path { fill: none; stroke-width: 1.3; stroke-opacity: 0.55; transition: stroke-opacity 0.2s, stroke-width 0.2s; }
.curves path.hot { stroke-width: 2.4; stroke-opacity: 1; }
.curves path.dim { stroke-opacity: 0.05; }
.step { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); column-gap: 96px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col-label { font: 11px var(--mono); color: var(--faint); letter-spacing: 0.1em; text-transform: uppercase; padding: 0 2px; }
.empty { font: 12px var(--mono); color: var(--faint); padding: 0 2px; }
.rec {
  position: relative;
  min-width: 0;
  padding: 10px 13px 11px;
  border-radius: 12px;
  border: 1px solid var(--edge);
  background: var(--glass-strong);
  transition: opacity 0.2s, border-color 0.2s, box-shadow 0.2s, background 0.2s;
}
.rec.ev { border-left: 2px solid var(--faint); }
.rec.ev.goal { border-left-color: #8fb3d9; }
.rec.dec {
  cursor: pointer;
  border-color: rgba(212, 162, 76, 0.22);
  background: linear-gradient(180deg, rgba(212, 162, 76, 0.05), rgba(255, 255, 255, 0.02));
}
.rec.hot { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(212, 162, 76, 0.35), 0 8px 28px -10px rgba(212, 162, 76, 0.35); }
.stage.focused .rec:not(.hot) { opacity: 0.42; }
.rec.flash { animation: flash 1.6s ease-out; }
@keyframes flash {
  0% { box-shadow: 0 0 0 3px rgba(212, 162, 76, 0.85); }
  100% { box-shadow: 0 0 0 0 rgba(212, 162, 76, 0); }
}
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 7px; font: 12px var(--mono); color: var(--muted); }
.head .id { color: var(--ink); font-weight: 600; }
.head .role { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.head .origin { color: #c9ced6; overflow-wrap: anywhere; }
pre.text, pre.actions {
  margin: 0;
  max-height: 260px;
  overflow: auto;
  font: 12.5px/1.55 var(--mono);
  color: #dde2e9;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
pre.actions { color: #f3e5c8; }
.says { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
.says::before { content: "says"; margin-right: 6px; font: 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.final { margin: 0; font-size: 15px; line-height: 1.5; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.rivals { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; font: 11.5px var(--mono); color: var(--muted); }
.track { position: relative; flex: 0 0 170px; height: 7px; border-radius: 99px; background: rgba(255, 255, 255, 0.07); }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, rgba(212, 162, 76, 0.5), var(--gold)); }
.track .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 2px; background: #e8ebf0; }

/* taints and explain */
.taint-line {
  margin: 0 -9px;
  padding: 5px 9px;
  border-radius: 8px;
  font: 12.5px/1.6 var(--mono);
  color: #f3dcae;
  cursor: pointer;
  overflow-wrap: anywhere;
}
.taint-line:hover, .taint-line:focus-visible { background: rgba(212, 162, 76, 0.09); outline: none; }
.taint-line[data-tag="UNSOURCED"] { color: #ff9a9a; }
.why .question { margin: 4px 0 10px; font-size: 15px; color: #cfd6df; }
.why .answer { margin: 0 0 6px; font-size: 16px; line-height: 1.55; overflow-wrap: anywhere; }
.claim {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 10px;
  padding: 9px 0;
  border-top: 1px solid var(--edge);
}
.claim::before { font: 13px var(--mono); flex: 0 0 auto; }
.claim.ok::before { content: "\2713"; color: var(--gold); }
.claim.struck::before { content: "\2717"; color: #ef5b5b; }
.claim.unproven::before { content: "?"; color: var(--muted); }
.claim .label { font: 11.5px var(--mono); color: var(--faint); flex: 0 0 auto; }
.claim .text { flex: 1 1 320px; min-width: 0; overflow-wrap: anywhere; }
.claim.struck .text { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(239, 91, 91, 0.8); }
.claim .pills { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.claim .reasons { flex: 0 0 100%; padding-left: 20px; font: 12px var(--mono); color: #ff9a9a; overflow-wrap: anywhere; }
.pill {
  font: 11.5px var(--mono);
  padding: 1px 9px;
  border-radius: 999px;
  border: 1px solid var(--gold);
  background: rgba(212, 162, 76, 0.08);
  color: var(--gold);
  cursor: pointer;
}
.pill:hover { background: rgba(212, 162, 76, 0.2); }
.pill:disabled { opacity: 0.4; cursor: default; }
.foot { margin-top: 22px; color: var(--faint); font-size: 12px; }

@media (max-width: 820px) {
  .wrap { padding: 16px 16px 72px; }
  /* Curves stay up at headset width. The desktop gutter still gives a trace room. */
  .step { grid-template-columns: minmax(0, 1fr); row-gap: 12px; }
  .track { flex-basis: 120px; }
}
@media (prefers-reduced-motion: reduce) {
  .chip[data-tag="UNSOURCED"], .badge.tag[data-tag="UNSOURCED"], .rec.flash { animation: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <div class="kicker">Causeway ledger</div>
      <h1 id="title">Causeway ledger</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="counts" id="counts"></div>
  </header>

  <section class="panel" id="legend" aria-label="Legend"></section>
  <section class="panel" id="taints" aria-label="Taints"></section>
  <section class="panel why" id="why" aria-label="Explain" hidden></section>

  <main class="stage" id="stage">
    <svg class="curves" id="curves" aria-hidden="true" focusable="false"></svg>
    <div class="rows" id="rows"></div>
  </main>

  <p class="foot">Cause tags are mechanical: each traces an argument to the record it came from. Explain claims are checked against the ledger before they are shown.</p>
</div>
<script type="application/json" id="ledger">__LEDGER_JSON__</script>
<script>
(function () {
  'use strict';

  var SVG_NS = 'http://www.w3.org/2000/svg';
  var DOT = '·';
  var RANK = { UNSOURCED: 0, IN: 1, CARRY: 2, GOAL: 3, SELF: 4, PROSE: 5, NOARGS: 6, FINAL: 7, LIT: 8 };
  var LEGEND = [
    ['IN', 'came from input that just arrived'],
    ['CARRY', 'came from input k steps back; fades with k'],
    ['GOAL', 'came from the task statement'],
    ['SELF', 'came only from the agent’s own earlier output'],
    ['UNSOURCED', 'appears nowhere earlier in the run'],
    ['PROSE', 'long text; the parts that matter are traced as atoms'],
    ['LIT', 'trivial literal, not traced']
  ];

  var DATA = JSON.parse(document.getElementById('ledger').textContent);
  var records = DATA.records || [];
  var header = {};
  var byId = {};
  var decisions = [];
  var steps = {};
  var goalSet = {};
  (DATA.goal || []).forEach(function (id) { goalSet[id] = true; });
  var labels = DATA.origins || {};
  var shown = DATA.shown || {};

  records.forEach(function (r) {
    if (r.kind === 'header') { header = r; return; }
    if (r.id) byId[r.id] = r;
    if (r.kind !== 'event' && r.kind !== 'decision') return;
    var group = steps[r.step] || (steps[r.step] = { events: [], decision: null });
    if (r.kind === 'event') {
      group.events.push(r);
    } else {
      decisions.push(r);
      group.decision = r;
    }
  });

  var stage = document.getElementById('stage');
  var rowsEl = document.getElementById('rows');
  var svg = document.getElementById('curves');
  var recEls = {};
  var causes = [];
  var causeById = {};
  var paths = [];
  var pinned = null;
  var hover = null;
  var pending = false;

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function tagParts(tag) {
    var text = String(tag || '');
    if (text.indexOf('CARRY' + DOT) === 0) {
      return { base: 'CARRY', k: parseInt(text.slice(6), 10) || 1 };
    }
    return { base: text, k: 0 };
  }

  function fade(k) {
    return k > 0 ? Math.max(0.42, 1 - 0.14 * (k - 1)) : 1;
  }

  function showValue(value) {
    var text = typeof value === 'string' ? JSON.stringify(value) : String(value);
    return text.length > 72 ? text.slice(0, 71) + '…' : text;
  }

  function tagBadge(tag) {
    var badge = el('span', 'badge tag', tag);
    badge.dataset.tag = tagParts(tag).base;
    return badge;
  }

  function compareTags(a, b) {
    var pa = tagParts(a);
    var pb = tagParts(b);
    return ((RANK[pa.base] || 9) - (RANK[pb.base] || 9)) || (pa.k - pb.k) || (a < b ? -1 : (a > b ? 1 : 0));
  }

  function claimText(claim) {
    if (claim && typeof claim.text === 'string') return claim.text;
    if (claim === null || claim === undefined) return '(no claim)';
    return JSON.stringify(claim);
  }

  function gotoRecord(id) {
    var node = recEls[id];
    if (!node) return;
    node.scrollIntoView({ behavior: 'smooth', block: 'center' });
    node.classList.remove('flash');
    void node.offsetWidth;
    node.classList.add('flash');
    node.addEventListener('animationend', function () { node.classList.remove('flash'); }, { once: true });
  }

  /* ---- focus: hover previews, a click pins; Esc clears ---- */

  function setHover(f) {
    hover = f;
    applyFocus();
  }

  function togglePin(f) {
    if (pinned && pinned.type === f.type && pinned.id === f.id) {
      pinned = null;
    } else {
      pinned = f;
    }
    applyFocus();
  }

  function hotSet(f) {
    var chips = {};
    var recs = {};
    var onPath;
    if (f.type === 'cause') {
      var cause = causeById[f.id];
      if (!cause) return null;
      chips[cause.cid] = true;
      recs[cause.decision] = true;
      cause.targets.forEach(function (t) { recs[t] = true; });
      onPath = function (p) { return p.cause === cause; };
    } else {
      causes.forEach(function (c) {
        if (c.targets.indexOf(f.id) !== -1) {
          chips[c.cid] = true;
          recs[c.decision] = true;
        }
      });
      recs[f.id] = true;
      onPath = function (p) { return p.target === f.id; };
    }
    return { chips: chips, recs: recs, onPath: onPath };
  }

  function applyFocus() {
    var f = hover || pinned;
    var hot = f ? hotSet(f) : null;
    stage.classList.toggle('focused', !!hot);
    causes.forEach(function (c) {
      c.chip.classList.toggle('hot', !!hot && !!hot.chips[c.cid]);
    });
    Object.keys(recEls).forEach(function (id) {
      recEls[id].classList.toggle('hot', !!hot && !!hot.recs[id]);
    });
    paths.forEach(function (p) {
      var on = !!hot && hot.onPath(p);
      p.el.classList.toggle('hot', on);
      p.el.classList.toggle('dim', !!hot && !on);
    });
  }

  /* ---- header, legend, taints, explain ---- */

  function renderHeader() {
    document.getElementById('title').textContent = DATA.title || 'Causeway ledger';
    var meta = [
      'run ' + (header.run_id || 'unknown'),
      'model ' + (header.model || 'unknown'),
      decisions.length + (decisions.length === 1 ? ' decision' : ' decisions'),
      Object.keys(steps).length + ' steps',
      'causeway ' + (header.causeway || '?')
    ];
    document.getElementById('meta').textContent = meta.join('  ·  ');

    var tagCounts = {};
    var taintTotal = 0;
    decisions.forEach(function (d) {
      tagCounts[d.tag] = (tagCounts[d.tag] || 0) + 1;
      if (d.watch) taintTotal += d.watch.length;
    });
    var box = document.getElementById('counts');
    box.textContent = '';
    Object.keys(tagCounts).sort(compareTags).forEach(function (tag) {
      var pill = el('span', 'count', tag + ' ' + tagCounts[tag]);
      pill.dataset.tag = tagParts(tag).base;
      box.appendChild(pill);
    });
    box.appendChild(el('span', 'count warn', taintTotal + (taintTotal === 1 ? ' taint' : ' taints')));
  }

  function renderLegend() {
    var box = document.getElementById('legend');
    box.textContent = '';
    var row = el('div', 'legend-row');
    LEGEND.forEach(function (entry) {
      var item = el('span', 'legend-item');
      var chip = el('span', 'chip static', entry[0] === 'CARRY' ? 'CARRY' + DOT + 'k' : entry[0]);
      chip.dataset.tag = entry[0];
      item.appendChild(chip);
      item.appendChild(el('span', null, entry[1]));
      row.appendChild(item);
    });
    box.appendChild(row);
    var extra = el('div', 'legend-row');
    extra.style.marginTop = '10px';
    [
      ['⚠', 'a watched tool argument that non-goal input steered'],
      ['ECHO←', 'the decision repeats an earlier one (a loop)'],
      ['margin', 'rival votes: gold is what the agent did, the bar mark is its strongest rival']
    ].forEach(function (entry) {
      var item = el('span', 'legend-item');
      item.appendChild(el('span', 'badge', entry[0]));
      item.appendChild(el('span', null, entry[1]));
      extra.appendChild(item);
    });
    box.appendChild(extra);
    box.appendChild(el('div', 'legend-note', 'Hover a chip to trace it. Click a chip or a record to pin the trace; click again or press Esc to clear.'));
  }

  function focusTaint(t) {
    var match = null;
    causes.some(function (c) {
      var pathMatch = c.path === t.base || c.path.indexOf(t.base + '~') === 0;
      if (c.decision === t.decision && c.action === t.action && c.tag === t.tag && c.source === t.source && pathMatch) {
        match = c;
        return true;
      }
      return false;
    });
    if (match) pinned = { type: 'cause', id: match.cid };
    applyFocus();
    gotoRecord(t.decision);
  }

  function renderTaints() {
    var panel = document.getElementById('taints');
    panel.textContent = '';
    var taints = DATA.taints || [];
    var total = 0;
    decisions.forEach(function (d) { if (d.watch) total += d.watch.length; });

    var head = el('div', 'panel-head');
    head.appendChild(el('h2', null, 'Taints'));
    head.appendChild(el('span', 'count warn', total + (total === 1 ? ' tainted value' : ' tainted values')));
    panel.appendChild(head);

    if (!DATA.watched) {
      panel.appendChild(el('p', 'muted', 'No watched tool ran in this run. To check a tool, tag with --watch TOOL,TOOL.'));
      return;
    }
    panel.appendChild(el('p', 'muted', 'Arguments of watched tools that the task did not supply. Click a line to trace it.'));
    if (!taints.length) {
      panel.appendChild(el('p', 'muted', 'No watched argument came from outside the task.'));
      return;
    }
    taints.forEach(function (t) {
      var line = el('div', 'taint-line', t.line);
      line.dataset.tag = tagParts(t.tag).base;
      line.tabIndex = 0;
      line.setAttribute('role', 'button');
      line.addEventListener('click', function () { focusTaint(t); });
      line.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); focusTaint(t); }
      });
      panel.appendChild(line);
    });
  }

  function citePill(cite) {
    var id = cite.id;
    var pill = el('button', 'pill', id);
    pill.type = 'button';
    pill.disabled = !byId[id];
    pill.setAttribute('title', byId[id] ? 'quote: ' + (cite.quote || '') : 'unknown id ' + id);
    pill.addEventListener('click', function (e) {
      e.stopPropagation();
      gotoRecord(id);
    });
    return pill;
  }

  function renderWhy() {
    var panel = document.getElementById('why');
    panel.textContent = '';
    var why = DATA.why;
    var question = DATA.question;
    panel.hidden = !(why || question);
    if (!why && !question) return;

    var head = el('div', 'panel-head');
    head.appendChild(el('h2', null, 'Explain'));
    if (why) head.appendChild(el('span', 'count', 'quote found ' + why.ok + '/' + why.total));
    panel.appendChild(head);

    if (question) panel.appendChild(el('p', 'question', question));
    if (!why) {
      panel.appendChild(el('p', 'muted', 'No explanation attached. Run causeway why with --json and pass the file with --why.'));
      return;
    }
    panel.appendChild(el('p', 'answer', why.answer === null || why.answer === undefined
      ? '(no answer: the reply did not match the answer schema)'
      : why.answer));
    panel.appendChild(el('p', 'muted', 'The model wrote this answer. Below, each claim shows whether its quotes were found in the records it cites. A found quote shows the record says it. It does not show the claim follows.'));

    (why.supported || []).forEach(function (claim) {
      var row = el('div', 'claim ok');
      row.appendChild(el('span', 'label', 'quote found'));
      row.appendChild(el('span', 'text', claimText(claim)));
      var pills = el('span', 'pills');
      var seen = {};
      (claim.cites || []).forEach(function (cite) {
        if (seen[cite.id]) return;
        seen[cite.id] = true;
        pills.appendChild(citePill(cite));
      });
      row.appendChild(pills);
      panel.appendChild(row);
    });

    if ((why.unproven || []).length) {
      panel.appendChild(el('h3', null, 'Quote found, not proof: a quote cannot show that something is absent'));
      why.unproven.forEach(function (u) {
        var row = el('div', 'claim unproven');
        row.appendChild(el('span', 'text', claimText(u && u.claim)));
        var cites = el('span', 'pills');
        var seen = {};
        ((u && u.claim && u.claim.cites) || []).forEach(function (cite) {
          if (seen[cite.id]) return;
          seen[cite.id] = true;
          cites.appendChild(citePill(cite));
        });
        row.appendChild(cites);
        row.appendChild(el('span', 'reasons', ((u && u.reasons) || []).join('; ')));
        panel.appendChild(row);
      });
    }

    if ((why.struck || []).length) {
      panel.appendChild(el('h3', null, 'Struck: not shown as fact'));
      why.struck.forEach(function (s) {
        var row = el('div', 'claim struck');
        row.appendChild(el('span', 'text', claimText(s && s.claim)));
        var reasons = (s && s.reasons) || [];
        row.appendChild(el('span', 'reasons', reasons.join('; ')));
        panel.appendChild(row);
      });
    }
  }

  /* ---- records ---- */

  function rivalsRow(r) {
    var total = Math.max(1, (r.k || 0) + 1);
    var votes = r.votes || {};
    var chosen = r.chosen;
    var chosenVotes = votes[chosen] || 0;
    var rival = 0;
    Object.keys(votes).forEach(function (sig) {
      if (sig !== chosen) rival = Math.max(rival, votes[sig]);
    });
    var row = el('div', 'rivals');
    row.setAttribute('title', Object.keys(votes).map(function (sig) { return votes[sig] + ' of ' + total + '  ' + sig; }).join('\n'));
    var track = el('div', 'track');
    var fill = el('div', 'fill');
    fill.style.width = (100 * chosenVotes / total) + '%';
    var mark = el('div', 'mark');
    mark.style.left = (100 * rival / total) + '%';
    track.appendChild(fill);
    track.appendChild(mark);
    row.appendChild(track);
    row.appendChild(el('span', null, 'margin ' + Number(r.margin).toFixed(2) + '  k=' + (r.k || 0)));
    if (r.upset) {
      row.appendChild(el('span', 'badge upset', 'upset'));
    } else if (r.near_miss) {
      row.appendChild(el('span', 'badge near', 'near miss'));
    }
    return row;
  }

  function tooltip(c) {
    var lines = [c.path + ' = ' + (typeof c.value === 'string' ? c.value : JSON.stringify(c.value)), c.tag];
    var sources = c.tag === 'PROSE' ? (c.sources || []) : (c.source ? [c.source] : []);
    if (sources.length) {
      sources.forEach(function (id) {
        lines.push('← ' + id + (labels[id] ? '  ' + labels[id] : ''));
      });
    } else if (c.tag === 'PROSE') {
      lines.push('no earlier record covers this text');
    } else {
      lines.push('← nowhere earlier in the run');
    }
    return lines.join('\n');
  }

  function causeChip(d, c) {
    var cid = 'c' + causes.length;
    var parts = tagParts(c.tag);
    var tainted = !!(d.watch && d.watch.some(function (w) { return w.action === c.action && w.path === c.path; }));
    var chip = el('span', 'chip' + (tainted ? ' taint' : ''));
    chip.dataset.tag = parts.base;
    chip.tabIndex = 0;
    chip.setAttribute('role', 'button');
    if (parts.k) chip.style.setProperty('--fade', String(fade(parts.k)));
    chip.setAttribute('title', tooltip(c));
    if (tainted) chip.appendChild(el('span', 'warn', '⚠'));
    chip.appendChild(el('span', 'path', c.path));
    chip.appendChild(el('span', 'eq', ' = '));
    chip.appendChild(el('span', 'val', showValue(c.value)));
    chip.appendChild(el('span', 'tg', c.tag));

    var targets = c.tag === 'PROSE' ? (c.sources || []).slice() : (c.source ? [c.source] : []);
    var cause = {
      cid: cid, decision: d.id, action: c.action, path: c.path, tag: c.tag,
      base: parts.base, source: c.source || null, targets: targets, chip: chip
    };
    causes.push(cause);
    causeById[cid] = cause;

    chip.addEventListener('mouseenter', function () { setHover({ type: 'cause', id: cid }); });
    chip.addEventListener('mouseleave', function () { setHover(null); });
    // A headset pointer and a finger don't hover. Pressing traces; click still pins.
    chip.addEventListener('pointerdown', function () { setHover({ type: 'cause', id: cid }); });
    chip.addEventListener('pointerup', function (e) {
      if (e.pointerType !== 'mouse') setHover(null);
    });
    chip.addEventListener('pointercancel', function () { setHover(null); });
    chip.addEventListener('focus', function () { setHover({ type: 'cause', id: cid }); });
    chip.addEventListener('blur', function () { setHover(null); });
    chip.addEventListener('click', function (e) {
      e.stopPropagation();
      togglePin({ type: 'cause', id: cid });
    });
    chip.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        togglePin({ type: 'cause', id: cid });
      }
    });
    return chip;
  }

  function eventCard(ev) {
    var isGoal = !!goalSet[ev.id];
    var card = el('article', 'rec ev' + (isGoal ? ' goal' : ''));
    card.id = 'rec-' + ev.id;
    card.dataset.id = ev.id;
    card.dataset.kind = 'event';
    recEls[ev.id] = card;

    var head = el('div', 'head');
    head.appendChild(el('span', 'id', ev.id));
    head.appendChild(el('span', 'role', ev.role || ''));
    var origin = labels[ev.id] || ev.name || '';
    if (origin) head.appendChild(el('span', 'origin', origin));
    if (isGoal) head.appendChild(el('span', 'badge goal-badge', 'goal'));
    card.appendChild(head);
    card.appendChild(el('pre', 'text', ev.text === null || ev.text === undefined ? '' : ev.text));
    card.addEventListener('click', function () { togglePin({ type: 'source', id: ev.id }); });
    return card;
  }

  function decisionCard(d) {
    var card = el('article', 'rec dec');
    card.id = 'rec-' + d.id;
    card.dataset.id = d.id;
    card.dataset.kind = 'decision';
    recEls[d.id] = card;

    var head = el('div', 'head');
    head.appendChild(el('span', 'id', d.id));
    head.appendChild(tagBadge(d.tag));
    if (d.watch) {
      var taints = d.watch.length;
      head.appendChild(taints
        ? el('span', 'badge warn', '⚠ ' + taints + (taints === 1 ? ' taint' : ' taints'))
        : el('span', 'badge quiet', 'watched, clean'));
    }
    if (d.echo_of) {
      var echo = el('button', 'badge echo', 'ECHO←' + d.echo_of);
      echo.type = 'button';
      echo.addEventListener('click', function (e) {
        e.stopPropagation();
        gotoRecord(d.echo_of);
      });
      head.appendChild(echo);
    }
    card.appendChild(head);

    if (d.final) {
      card.appendChild(el('p', 'final', d.text || '(empty answer)'));
    } else {
      card.appendChild(el('pre', 'actions', shown[d.id] || ''));
      if (d.text) card.appendChild(el('p', 'says', d.text));
    }

    var chips = el('div', 'chips');
    (d.causes || []).forEach(function (c) { chips.appendChild(causeChip(d, c)); });
    if (chips.childNodes.length) card.appendChild(chips);
    if (d.rivals) card.appendChild(rivalsRow(d.rivals));

    card.addEventListener('click', function () { togglePin({ type: 'source', id: d.id }); });
    return card;
  }

  function renderSteps() {
    Object.keys(steps).map(Number).sort(function (a, b) { return a - b; }).forEach(function (n) {
      var group = steps[n];
      var row = el('section', 'step');
      row.dataset.step = String(n);

      var left = el('div', 'col in');
      left.appendChild(el('div', 'col-label', 'input · step ' + n));
      if (!group.events.length) left.appendChild(el('div', 'empty', 'no new input'));
      group.events.forEach(function (ev) { left.appendChild(eventCard(ev)); });

      var right = el('div', 'col dec');
      right.appendChild(el('div', 'col-label', group.decision ? 'decision ' + group.decision.id : 'no decision'));
      if (group.decision) right.appendChild(decisionCard(group.decision));

      row.appendChild(left);
      row.appendChild(right);
      rowsEl.appendChild(row);
    });
  }

  /* ---- curves: one cubic bezier from each cause chip to each source record ---- */

  function buildCurves() {
    causes.forEach(function (c) {
      var color = getComputedStyle(c.chip).getPropertyValue('--c').trim() || '#9aa3af';
      var k = tagParts(c.tag).k;
      c.targets.forEach(function (target) {
        if (!recEls[target]) return;
        var path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('class', 'curve');
        path.setAttribute('stroke', color);
        path.setAttribute('data-tag', c.base);
        if (k) path.style.setProperty('stroke-opacity', String(0.55 * fade(k)));
        svg.appendChild(path);
        paths.push({ el: path, cause: c, target: target, toDecision: recEls[target].dataset.kind === 'decision' });
      });
    });
  }

  function draw() {
    var box = stage.getBoundingClientRect();
    var width = stage.clientWidth;
    var height = stage.offsetHeight;
    svg.setAttribute('width', String(width));
    svg.setAttribute('height', String(height));
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    paths.forEach(function (p) {
      var from = p.cause.chip.getBoundingClientRect();
      var to = recEls[p.target].getBoundingClientRect();
      var y1 = from.top - box.top + from.height / 2;
      var y2 = to.top - box.top + to.height / 2;
      var d;
      if (p.toDecision) {
        // a source in the decision column: leave on the right and loop out past the card edge
        var startX = from.right - box.left;
        var endX = to.right - box.left;
        var bulge = Math.max(startX, endX) + 64;
        d = 'M' + startX + ' ' + y1 + ' C' + bulge + ' ' + y1 + ' ' + bulge + ' ' + y2 + ' ' + endX + ' ' + y2;
      } else {
        // a source in the input column: leave on the left and arrive at the card's right edge
        var fromX = from.left - box.left;
        var toX = to.right - box.left;
        var reach = Math.max(60, Math.abs(fromX - toX) * 0.5);
        d = 'M' + fromX + ' ' + y1 + ' C' + (fromX - reach) + ' ' + y1 + ' ' + (toX + reach) + ' ' + y2 + ' ' + toX + ' ' + y2;
      }
      p.el.setAttribute('d', d);
    });
  }

  function requestDraw() {
    if (pending) return;
    pending = true;
    window.requestAnimationFrame(function () {
      pending = false;
      draw();
    });
  }

  function init() {
    renderHeader();
    renderLegend();
    renderTaints();
    renderWhy();
    renderSteps();
    buildCurves();
    applyFocus();
    requestDraw();

    window.addEventListener('resize', requestDraw);
    window.addEventListener('scroll', requestDraw, { passive: true });
    if (window.ResizeObserver) new ResizeObserver(requestDraw).observe(stage);

    document.addEventListener('click', function (e) {
      var target = e.target;
      if (target && target.closest && target.closest('.rec, .chip, .pill, .taint-line, .badge')) return;
      if (pinned) {
        pinned = null;
        applyFocus();
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        pinned = null;
        hover = null;
        applyFocus();
      }
    });
  }

  init();
})();
</script>
</body>
</html>
