[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causeway"
version = "0.1.0"
description = "See why your agent acted: cause-tagged, verifiable agent ledgers."
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]
muse = ["mcp>=1.27", "uvicorn>=0.30"]

[tool.setuptools]
packages = ["causeway", "causeway.demo", "causeway.demo.scenarios", "causeway.companion"]

[tool.setuptools.package-dir]
"causeway.demo.scenarios" = "demo/scenarios"

[tool.setuptools.package-data]
causeway = ["*.html"]
"causeway.demo.scenarios" = ["**/*", "*/*", "*/*/*", "*/*/*/*"]
"causeway.companion" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real Meta Model API (skipped without a key)"]
